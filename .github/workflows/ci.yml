name: CI

# Artículo VII: el corpus de evaluación y su harness se ejecutan como condición de merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .
      - name: Suite (contrato + unidad + integración sin modelos)
        run: uv run pytest tests/ -v -m "not needs_models and not needs_corpus"

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Evaluación sobre el corpus público
        run: uv run nonio eval --corpus public --json
      - name: Puerta FR-030 — sesgo contra prosa de no nativo <= 2.0x
        run: uv run python -m nonio.evaluation.gate --max-ratio 2.0
