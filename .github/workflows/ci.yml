name: CI

# Artículo VII: el corpus y su harness se ejecutan como condición de merge. Pero
# medir el corpus entero exige descargar 1 GB de modelos y una hora de CPU, así
# que en cada push se comprueba lo que se puede comprobar sin modelos —que son
# precisamente los invariantes constitucionales— y la calibración completa vive en
# calibration.yml, programada y manual.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .
      - name: Suite sin modelos
        run: uv run pytest tests/ -v -m "not needs_models"

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev

      - name: Integridad del corpus
        # Licencia y procedencia en cada caso, sin huérfanos, y ningún texto
        # generado con la familia de un perfil de medición (R-006).
        run: uv run pytest tests/unit/test_corpus_manifest.py -v

      - name: Puerta de sesgo FR-030
        # Sobre el artefacto de calibración versionado, sin remedir. Falla solo si
        # el veredicto es `bloquea`; `no_concluyente` avisa y pasa, porque es el
        # estado conocido del proyecto y un rojo permanente sería ruido.
        run: uv run python -m nonio.evaluation.gate

      - name: El corpus empaquetado está al día
        run: |
          uv run python -m nonio.evaluation.bundle --out /tmp/corpus.jsonl.gz
          test -s nonio/_corpus/corpus.jsonl.gz

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - name: El comando instalado funciona
        # Un fallo de empaquetado es invisible para los tests de lógica: el código
        # puede estar perfecto y el paquete instalado no arrancar. Ya pasó una vez.
        run: |
          uv venv /tmp/v --python 3.12
          uv pip install --python /tmp/v/bin/python dist/*.whl
          /tmp/v/bin/nonio schema --version
          /tmp/v/bin/nonio profiles
