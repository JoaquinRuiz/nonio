<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Nonio — a measuring instrument for text">
  <defs>
    <style>
      .bg{fill:#fbfaf8}.ink{fill:#1c1a17}.mut{fill:#6b6560}.acc{fill:#2f5d7c}
      .tick{stroke:#1c1a17;stroke-width:1.6}.tickm{stroke:#6b6560;stroke-width:1.2}
      .rule{stroke:#c9c2b8;stroke-width:1.4;fill:none}
      .vern{fill:#eef3f7;stroke:#2f5d7c;stroke-width:1.6}
      .vtick{stroke:#2f5d7c;stroke-width:1.6}
      @media (prefers-color-scheme: dark){
        .bg{fill:#16181a}.ink{fill:#e8e6e3}.mut{fill:#9a948e}.acc{fill:#79b0d6}
        .tick{stroke:#e8e6e3}.tickm{stroke:#9a948e}.rule{stroke:#3a3f44}
        .vern{fill:#1e2a33;stroke:#79b0d6}.vtick{stroke:#79b0d6}
      }
    </style>
  </defs>
  <rect class="bg" width="880" height="220"/>

  <!-- regla principal -->
  <line class="rule" x1="60" y1="96" x2="820" y2="96"/>
  <g>
    <!-- marcas mayores cada 76px, menores cada 15.2px -->
    <g class="tick">
      <line x1="60"  y1="96" x2="60"  y2="70"/><line x1="136" y1="96" x2="136" y2="70"/>
      <line x1="212" y1="96" x2="212" y2="70"/><line x1="288" y1="96" x2="288" y2="70"/>
      <line x1="364" y1="96" x2="364" y2="70"/><line x1="440" y1="96" x2="440" y2="70"/>
      <line x1="516" y1="96" x2="516" y2="70"/><line x1="592" y1="96" x2="592" y2="70"/>
      <line x1="668" y1="96" x2="668" y2="70"/><line x1="744" y1="96" x2="744" y2="70"/>
      <line x1="820" y1="96" x2="820" y2="70"/>
    </g>
    <g class="tickm">
      <line x1="75"  y1="96" x2="75"  y2="82"/><line x1="90"  y1="96" x2="90"  y2="82"/>
      <line x1="106" y1="96" x2="106" y2="82"/><line x1="121" y1="96" x2="121" y2="82"/>
      <line x1="151" y1="96" x2="151" y2="82"/><line x1="166" y1="96" x2="166" y2="82"/>
      <line x1="182" y1="96" x2="182" y2="82"/><line x1="197" y1="96" x2="197" y2="82"/>
      <line x1="227" y1="96" x2="227" y2="82"/><line x1="242" y1="96" x2="242" y2="82"/>
      <line x1="258" y1="96" x2="258" y2="82"/><line x1="273" y1="96" x2="273" y2="82"/>
      <line x1="303" y1="96" x2="303" y2="82"/><line x1="318" y1="96" x2="318" y2="82"/>
      <line x1="334" y1="96" x2="334" y2="82"/><line x1="349" y1="96" x2="349" y2="82"/>
      <line x1="379" y1="96" x2="379" y2="82"/><line x1="394" y1="96" x2="394" y2="82"/>
      <line x1="410" y1="96" x2="410" y2="82"/><line x1="425" y1="96" x2="425" y2="82"/>
      <line x1="455" y1="96" x2="455" y2="82"/><line x1="470" y1="96" x2="470" y2="82"/>
      <line x1="486" y1="96" x2="486" y2="82"/><line x1="501" y1="96" x2="501" y2="82"/>
      <line x1="531" y1="96" x2="531" y2="82"/><line x1="546" y1="96" x2="546" y2="82"/>
      <line x1="562" y1="96" x2="562" y2="82"/><line x1="577" y1="96" x2="577" y2="82"/>
      <line x1="607" y1="96" x2="607" y2="82"/><line x1="622" y1="96" x2="622" y2="82"/>
      <line x1="638" y1="96" x2="638" y2="82"/><line x1="653" y1="96" x2="653" y2="82"/>
      <line x1="683" y1="96" x2="683" y2="82"/><line x1="698" y1="96" x2="698" y2="82"/>
      <line x1="714" y1="96" x2="714" y2="82"/><line x1="729" y1="96" x2="729" y2="82"/>
      <line x1="759" y1="96" x2="759" y2="82"/><line x1="774" y1="96" x2="774" y2="82"/>
      <line x1="790" y1="96" x2="790" y2="82"/><line x1="805" y1="96" x2="805" y2="82"/>
    </g>
  </g>

  <!-- el nonio: la escala deslizante que da la precisión extra -->
  <rect class="vern" x="330" y="100" width="196" height="34" rx="4"/>
  <g class="vtick">
    <line x1="349" y1="100" x2="349" y2="120"/><line x1="368" y1="100" x2="368" y2="114"/>
    <line x1="387" y1="100" x2="387" y2="114"/><line x1="406" y1="100" x2="406" y2="114"/>
    <line x1="425" y1="100" x2="425" y2="120"/><line x1="444" y1="100" x2="444" y2="114"/>
    <line x1="463" y1="100" x2="463" y2="114"/><line x1="482" y1="100" x2="482" y2="114"/>
    <line x1="501" y1="100" x2="501" y2="120"/>
  </g>

  <text class="ink" x="60" y="176" font-family="Georgia,'Times New Roman',serif"
        font-size="52" letter-spacing="-1">nonio</text>
  <text class="mut" x="204" y="176" font-family="-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="17">un instrumento de medida sobre texto</text>
  <text class="acc" x="60" y="202" font-family="-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="13" letter-spacing="1.4">NO DECIDE AUTORÍA</text>
</svg>
